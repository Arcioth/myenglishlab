<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Asset Cropper</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        arch: '#1793d1', // A nod to Arch Linux blue for accents
                        darkbase: '#1e2024',
                        darkpanel: '#282b30',
                    }
                }
            }
        }
    </script>

    <!-- Cropper.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #1e2024; color: #e5e7eb; font-family: 'Segoe UI', system-ui, sans-serif; }
        .cropper-container { width: 100%; max-height: 60vh; background-color: #111; }
        img { max-width: 100%; }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e2024; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-darkpanel border-b border-gray-700 p-4 flex justify-between items-center shadow-md z-10">
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-arch" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Asset Cropper Studio
            </h1>
            <p class="text-xs text-gray-400 mt-1">Splash (4:3) & Profile (1:1) Generator</p>
        </div>
        <button id="btn-download-zip" disabled class="bg-arch hover:bg-blue-600 disabled:opacity-50 disabled:hover:bg-arch text-white px-5 py-2 rounded-lg font-medium shadow transition-colors flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Generate ZIP
        </button>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Character List -->
        <aside class="w-72 bg-darkpanel border-r border-gray-700 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-gray-700 bg-gray-800/50">
                <h2 class="text-sm uppercase tracking-wider text-gray-400 font-semibold">Roster</h2>
            </div>
            <div id="character-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Character Items Injected via JS -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col p-6 overflow-y-auto bg-darkbase">
            
            <div class="max-w-5xl w-full mx-auto space-y-6">
                
                <!-- Top Controls -->
                <div class="bg-darkpanel p-5 rounded-xl border border-gray-700 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    
                    <div class="flex-1">
                        <h2 id="current-char-name" class="text-2xl font-bold text-white tracking-tight">Select a Character</h2>
                        <span id="current-char-tier" class="inline-block mt-1 px-2 py-1 bg-gray-700 text-xs font-mono rounded text-gray-300">T-?</span>
                    </div>

                    <div class="flex items-center gap-4 w-full md:w-auto">
                        <label class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition-colors border border-gray-600 flex items-center gap-2 w-full justify-center md:w-auto">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <span>Load Image</span>
                            <input type="file" id="image-upload" accept="image/*" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- Cropper Area -->
                <div class="bg-darkpanel border border-gray-700 rounded-xl overflow-hidden shadow-sm flex flex-col relative min-h-[400px]">
                    
                    <!-- Toolbar overlay -->
                    <div class="absolute top-4 left-4 z-10 flex gap-2 bg-gray-900/80 p-1.5 rounded-lg backdrop-blur-sm border border-gray-700">
                        <button id="ratio-splash" class="px-3 py-1.5 rounded-md bg-arch text-white text-sm font-medium transition-colors shadow-sm">Splash (4:3)</button>
                        <button id="ratio-profile" class="px-3 py-1.5 rounded-md hover:bg-gray-700 text-gray-300 text-sm font-medium transition-colors">Profile (1:1)</button>
                    </div>

                    <div class="absolute top-4 right-4 z-10">
                         <button id="btn-save-crop" disabled class="px-4 py-2 rounded-lg bg-green-600 hover:bg-green-500 disabled:opacity-50 disabled:bg-gray-600 text-white font-bold transition-colors shadow-lg flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Save Crop
                        </button>
                    </div>

                    <!-- Cropper Canvas -->
                    <div class="flex-1 w-full flex items-center justify-center bg-[#0a0a0c] bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAIklEQVQ4T2NkYGD4z8DAwMgAFyAMMiqgEQzDxIBh2AEsBwA35wL54v44WQAAAABJRU5ErkJggg==')]">
                        <img id="image-workspace" src="" class="hidden">
                        <div id="no-image-text" class="text-gray-500 text-center p-10 flex flex-col items-center">
                            <svg class="w-16 h-16 mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Upload an image to start cropping
                        </div>
                    </div>
                </div>

                <!-- Saved Previews -->
                <div class="bg-darkpanel border border-gray-700 rounded-xl p-5 shadow-sm">
                    <h3 class="text-sm uppercase tracking-wider text-gray-400 font-semibold mb-4">Current Character Assets</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <!-- Splash Preview -->
                        <div class="border border-gray-700 rounded-lg bg-gray-800 p-3 flex flex-col">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-medium text-gray-300">Splash Art (4:3)</span>
                                <span id="status-splash" class="text-xs text-red-400">Missing</span>
                            </div>
                            <div class="flex-1 min-h-[120px] bg-[#1a1c20] rounded border border-dashed border-gray-600 flex items-center justify-center overflow-hidden">
                                <img id="preview-splash" src="" class="hidden max-h-full object-contain">
                            </div>
                        </div>

                        <!-- Profile Preview -->
                        <div class="border border-gray-700 rounded-lg bg-gray-800 p-3 flex flex-col">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-medium text-gray-300">Profile Icon (1:1)</span>
                                <span id="status-profile" class="text-xs text-red-400">Missing</span>
                            </div>
                            <div class="flex-1 min-h-[120px] bg-[#1a1c20] rounded border border-dashed border-gray-600 flex items-center justify-center overflow-hidden">
                                <img id="preview-profile" src="" class="hidden max-h-[120px] object-contain rounded-full border-2 border-gray-500">
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        // Data Structure
        const characters = [
            { id: "SHI", name: "SHI", tier: "T6", desc: "Death incarnate" },
            { id: "LIFE", name: "LIFE", tier: "T6", desc: "Oldest weaver of life" },
            { id: "ARION", name: "ARION", tier: "T5", desc: "The Celestial Wanderer" },
            { id: "ELYSIA", name: "ELYSIA", tier: "T5", desc: "The Chronomancer" },
            { id: "RETHAAL", name: "RETHAAL", tier: "T4", desc: "Skeletal knight" },
            { id: "VARGAS", name: "VARGAS", tier: "T4", desc: "The Iron Sentinel" },
            { id: "KORRA", name: "KORRA", tier: "T3", desc: "The Flame Weaver" },
            { id: "ORION", name: "ORION", tier: "T3", desc: "The Beast Master" },
            { id: "LILA", name: "LILA", tier: "T2", desc: "The Shadow Thief" },
            { id: "DRAVEN", name: "DRAVEN", tier: "T2", desc: "The Arena Champion" },
            { id: "BARRICK", name: "BARRICK", tier: "T1", desc: "The Village Guard" },
            { id: "FAYE", name: "FAYE", tier: "T1", desc: "The Apprentice Mage" }
        ];

        // State
        let activeCharId = characters[0].id;
        let activeRatio = 'splash'; // 'splash' or 'profile'
        let crops = {}; // Format: { charId: { splash: 'base64...', profile: 'base64...' } }
        let cropperInstance = null;
        let currentImageSrc = null;

        // Init crops object
        characters.forEach(c => crops[c.id] = { splash: null, profile: null });

        // DOM Elements
        const DOM = {
            list: document.getElementById('character-list'),
            charName: document.getElementById('current-char-name'),
            charTier: document.getElementById('current-char-tier'),
            upload: document.getElementById('image-upload'),
            imgWorkspace: document.getElementById('image-workspace'),
            noImgText: document.getElementById('no-image-text'),
            btnSplash: document.getElementById('ratio-splash'),
            btnProfile: document.getElementById('ratio-profile'),
            btnSave: document.getElementById('btn-save-crop'),
            btnZip: document.getElementById('btn-download-zip'),
            previewSplash: document.getElementById('preview-splash'),
            previewProfile: document.getElementById('preview-profile'),
            statusSplash: document.getElementById('status-splash'),
            statusProfile: document.getElementById('status-profile')
        };

        // Initialize App
        function init() {
            renderSidebar();
            selectCharacter(characters[0].id);
            attachListeners();
        }

        function attachListeners() {
            DOM.upload.addEventListener('change', handleImageUpload);
            DOM.btnSplash.addEventListener('click', () => setRatio('splash'));
            DOM.btnProfile.addEventListener('click', () => setRatio('profile'));
            DOM.btnSave.addEventListener('click', saveCrop);
            DOM.btnZip.addEventListener('click', generateZip);
        }

        // --- Renders ---

        function renderSidebar() {
            DOM.list.innerHTML = '';
            characters.forEach(char => {
                const charCrops = crops[char.id];
                const count = (charCrops.splash ? 1 : 0) + (charCrops.profile ? 1 : 0);
                
                let indicatorHTML = `<div class="w-3 h-3 rounded-full border border-gray-600 bg-transparent"></div>`;
                if (count === 1) indicatorHTML = `<div class="w-3 h-3 rounded-full border border-yellow-500 bg-yellow-500/50"></div>`;
                if (count === 2) indicatorHTML = `<div class="w-3 h-3 rounded-full border border-green-500 bg-green-500"></div>`;

                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2.5 rounded-lg flex items-center justify-between transition-colors ${char.id === activeCharId ? 'bg-gray-700/80 border border-gray-600 shadow-sm' : 'hover:bg-gray-800 text-gray-400'}`;
                btn.onclick = () => selectCharacter(char.id);
                
                btn.innerHTML = `
                    <div class="flex flex-col">
                        <span class="${char.id === activeCharId ? 'text-white font-semibold' : ''}">${char.name}</span>
                        <span class="text-[10px] uppercase font-mono tracking-wider ${char.id === activeCharId ? 'text-arch' : 'text-gray-500'}">${char.tier}</span>
                    </div>
                    ${indicatorHTML}
                `;
                DOM.list.appendChild(btn);
            });
            updateZipButtonState();
        }

        function selectCharacter(id) {
            activeCharId = id;
            const char = characters.find(c => c.id === id);
            
            DOM.charName.textContent = char.name;
            DOM.charTier.textContent = char.tier;
            
            renderSidebar(); // Update active state in list
            updatePreviews();
        }

        function updatePreviews() {
            const charCrops = crops[activeCharId];
            
            // Splash
            if (charCrops.splash) {
                DOM.previewSplash.src = charCrops.splash;
                DOM.previewSplash.classList.remove('hidden');
                DOM.statusSplash.textContent = "Saved";
                DOM.statusSplash.className = "text-xs font-semibold text-green-400";
            } else {
                DOM.previewSplash.classList.add('hidden');
                DOM.statusSplash.textContent = "Missing";
                DOM.statusSplash.className = "text-xs text-red-400";
            }

            // Profile
            if (charCrops.profile) {
                DOM.previewProfile.src = charCrops.profile;
                DOM.previewProfile.classList.remove('hidden');
                DOM.statusProfile.textContent = "Saved";
                DOM.statusProfile.className = "text-xs font-semibold text-green-400";
            } else {
                DOM.previewProfile.classList.add('hidden');
                DOM.statusProfile.textContent = "Missing";
                DOM.statusProfile.className = "text-xs text-red-400";
            }
        }

        // --- Cropper Logic ---

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                currentImageSrc = event.target.result;
                DOM.imgWorkspace.src = currentImageSrc;
                DOM.imgWorkspace.classList.remove('hidden');
                DOM.noImgText.classList.add('hidden');
                DOM.btnSave.disabled = false;
                
                initCropper();
            };
            reader.readAsDataURL(file);
        }

        function initCropper() {
            if (cropperInstance) cropperInstance.destroy();

            const aspectRatio = activeRatio === 'splash' ? 4 / 3 : 1 / 1;

            cropperInstance = new Cropper(DOM.imgWorkspace, {
                aspectRatio: aspectRatio,
                viewMode: 1, // Restrict crop box to not exceed canvas
                dragMode: 'move',
                autoCropArea: 0.9,
                background: false,
                zoomable: true,
                responsive: true,
            });
        }

        function setRatio(ratio) {
            activeRatio = ratio;
            
            // Update UI Buttons
            if (ratio === 'splash') {
                DOM.btnSplash.className = "px-3 py-1.5 rounded-md bg-arch text-white text-sm font-medium transition-colors shadow-sm";
                DOM.btnProfile.className = "px-3 py-1.5 rounded-md hover:bg-gray-700 text-gray-300 text-sm font-medium transition-colors";
            } else {
                DOM.btnProfile.className = "px-3 py-1.5 rounded-md bg-arch text-white text-sm font-medium transition-colors shadow-sm";
                DOM.btnSplash.className = "px-3 py-1.5 rounded-md hover:bg-gray-700 text-gray-300 text-sm font-medium transition-colors";
            }

            if (cropperInstance) {
                cropperInstance.setAspectRatio(ratio === 'splash' ? 4 / 3 : 1 / 1);
            }
        }

        function saveCrop() {
            if (!cropperInstance) return;

            // Get canvas based on desired output size to keep high quality
            const canvas = cropperInstance.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            if(!canvas) return;

            const base64Image = canvas.toDataURL('image/png');
            
            // Save to state
            crops[activeCharId][activeRatio] = base64Image;
            
            // Re-render UI
            updatePreviews();
            renderSidebar();
            
            // Visual feedback on save button
            const originalText = DOM.btnSave.innerHTML;
            DOM.btnSave.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Saved!`;
            DOM.btnSave.classList.replace('bg-green-600', 'bg-blue-600');
            setTimeout(() => {
                DOM.btnSave.innerHTML = originalText;
                DOM.btnSave.classList.replace('bg-blue-600', 'bg-green-600');
            }, 1000);
        }

        // --- ZIP Generation ---
        
        function updateZipButtonState() {
            let hasAtLeastOne = false;
            for (const charId in crops) {
                if (crops[charId].splash || crops[charId].profile) {
                    hasAtLeastOne = true;
                    break;
                }
            }
            DOM.btnZip.disabled = !hasAtLeastOne;
        }

        async function generateZip() {
            DOM.btnZip.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Packaging...`;
            DOM.btnZip.disabled = true;

            const zip = new JSZip();
            const rootFolder = zip.folder("Character_Assets");

            for (const charId in crops) {
                const charData = crops[charId];
                // Sanitize charId just in case, though they are clean string names
                const safeName = charId.replace(/[^a-z0-9]/gi, '_').toUpperCase();

                if (charData.splash) {
                    const base64Data = charData.splash.split('base64,')[1];
                    rootFolder.file(`${safeName}_splash.png`, base64Data, { base64: true });
                }
                
                if (charData.profile) {
                    const base64Data = charData.profile.split('base64,')[1];
                    rootFolder.file(`${safeName}_profile.png`, base64Data, { base64: true });
                }
            }

            try {
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "Character_Roster_Assets.zip");
            } catch (error) {
                alert("Error generating ZIP file.");
                console.error(error);
            } finally {
                DOM.btnZip.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Generate ZIP`;
                DOM.btnZip.disabled = false;
            }
        }

        // Start
        init();
    </script>
</body>
</html>
